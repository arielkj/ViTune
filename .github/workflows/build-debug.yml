name: Build debug APK (car)

on:
  push:
    branches: [vitune-car]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;4.1.2"

      # compileSdk 37 (Android 17 preview) is only published on the canary
      # channel; the stable channel has no "platforms;android-37" package.
      - name: Install Android 37 platform (canary channel)
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 \
            "platforms;android-37" \
            "build-tools;37.0.0"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
        env:
          GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vitune-car-apk
          path: app/build/outputs/apk/debug/*.apk
